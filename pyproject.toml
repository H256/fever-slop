[project]
name = "feverslop"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "audioread>=3.1.0",
    "demucs>=4.0.1",
    "librosa>=0.11.0",
    "insightface>=0.7.3",
    "numpy>=2.4.6",
    "onnxruntime>=1.18.0",
    "opencv-python>=4.10.0",
    "openai>=2.41.1",
    "openai-whisper>=20250625",
    "pillow>=12.0.0",
    "pydantic>=2.13.4",
    "pyside6>=6.10,<7",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.14.0",
    "torchvision>=0.27.0",
]

[project.optional-dependencies]
test = [
    "coverage>=7.0.0",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
