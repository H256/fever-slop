[project]
name = "feverslop"
version = "0.6.0"
description = "Local music-video generation pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "H256" },
]
keywords = [
    "fever",
    "music-video",
    "generation",
    "pipeline",
    "audio",
    "video",
    "image-generation",
    "pytorch",
    "comfyui",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Pre-Production",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "audioread>=3.1.0",
    "demucs>=4.0.1",
    "dspy-ai>=3.3.0",
    "librosa>=0.11.0",
    "insightface>=0.7.3",
    "jinja2>=3.1.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.18.0",
    "opencv-python>=4.10.0",
    "openai>=2.41.1",
    "openai-whisper>=20250625",
    "pillow>=12.0.0",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "soundfile>=0.14.0",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchcodec>=0.14.0",
    "torchvision>=0.27.0",
]

[project.optional-dependencies]
test = [
    "coverage>=7.0.0",
]

[project.scripts]
feverslop = "feverslop.cli.app:main"

[tool.setuptools.package-data]
"feverslop.tools" = ["templates/*.html"]
"feverslop.prompting" = ["guides/*.md"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[project.urls]
Homepage = "https://github.com/H256/fever-slop"
Repository = "https://github.com/H256/fever-slop"
"Issue Tracker" = "https://github.com/H256/fever-slop/issues"
