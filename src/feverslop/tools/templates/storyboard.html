<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@600,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
{% raw %}    :root {{
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --background: #FAFAFA;
      --surface: #FFFFFF;
      --text-primary: #0A0A0A;
      --text-secondary: #6B6B6B;
      --neutral: #9C9C9C;
      --border: #E8E8EC;
      --warning: #F59E0B;
    }}

    * {{
      box-sizing: border-box;
    }}

    body {{
      margin: 0;
      background: var(--background);
      color: var(--text-primary);
      font-family: "DM Sans", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }}

    a {{
      color: var(--primary);
    }}

    a:focus-visible,
    summary:focus-visible {{
      outline: none;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
      border-radius: 6px;
    }}

    .page {{
      width: 100%;
      max-width: none;
      margin: 0 auto;
      padding: 48px 24px 64px;
    }}

    .page-header {{
      margin-bottom: 32px;
    }}

    h1,
    h2 {{
      font-family: "General Sans", Inter, Arial, sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
    }}

    h1 {{
      font-size: clamp(40px, 7vw, 72px);
      line-height: 0.95;
    }}

    .page-meta {{
      color: var(--text-secondary);
      margin-top: 12px;
    }}

    .header-row {{
      align-items: end;
      display: flex;
      gap: 24px;
      justify-content: space-between;
    }}

    .mode-switch {{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: inline-flex;
      padding: 4px;
    }}

    .mode-button {{
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: "DM Sans", Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      min-height: 32px;
      padding: 0 12px;
      transition: background 200ms ease, color 200ms ease, transform 200ms ease;
    }}

    .mode-button:hover {{
      color: var(--primary-hover);
      transform: translateY(-1px);
    }}

    .mode-button:focus-visible {{
      outline: none;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
    }}

    body.mode-full .mode-button[data-mode-button="full"],
    body.mode-compact .mode-button[data-mode-button="compact"] {{
      background: var(--primary);
      color: #FFFFFF;
    }}

    .grid {{
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(max(280px, calc((100vw - 144px) / 5)), 1fr));
      gap: 24px;
    }}

    .scene-card {{
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      transition: transform 200ms ease, box-shadow 200ms ease;
    }}

    .scene-card:hover {{
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }}

    .scene-header {{
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--border);
    }}

    h2 {{
      font-size: 24px;
      line-height: 1.1;
    }}

    .chips {{
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }}

    .chip {{
      border-radius: 9999px;
      background: #F3F4F6;
      color: var(--text-secondary);
      font-size: 12px;
      padding: 4px 12px;
    }}

    .image-link {{
      display: block;
      background: #F3F4F6;
      line-height: 0;
    }}

    .image-link:hover {{
      outline: 2px solid var(--primary);
      outline-offset: -2px;
    }}

    img {{
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }}

    .missing-image {{
      display: grid;
      min-height: 220px;
      place-items: center;
      background: #FFF7ED;
      color: var(--warning);
      font-weight: 500;
    }}

    .scene-content {{
      padding: 20px;
    }}

    .caption {{
      margin: 0 0 20px;
      color: var(--text-primary);
      font-size: 15px;
    }}

    .field {{
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
    }}

    .field-label {{
      color: var(--neutral);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }}

    .field-value {{
      color: var(--text-secondary);
    }}

    details {{
      border-top: 1px solid var(--border);
      margin-top: 12px;
      padding-top: 12px;
    }}

    summary {{
      color: var(--primary);
      cursor: pointer;
      font-weight: 500;
    }}

    summary:hover {{
      color: var(--primary-hover);
    }}

    .code {{
      color: var(--text-secondary);
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 12px;
      line-height: 1.55;
      margin-top: 8px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }}

    .relay-row {{
      border-top: 1px solid var(--border);
      margin-top: 12px;
      padding-top: 12px;
    }}

    .relay-meta {{
      color: var(--neutral);
      font-size: 12px;
      margin-bottom: 4px;
    }}

    body.mode-compact .scene-header,
    body.mode-compact .scene-content {{
      display: none;
    }}

    body.mode-compact .image-link:hover {{
      outline-offset: -3px;
    }}

    @media (max-width: 720px) {{
      .header-row {{
        align-items: start;
        flex-direction: column;
      }}
    }}
{% endraw %}
  </style>
</head>
<body class="mode-full">
  <main class="page">
    <header class="page-header">
      <div class="header-row">
        <h1>{{ title }}</h1>
        <div class="mode-switch" aria-label="Storyboard view mode">
          <button class="mode-button" type="button" data-mode-button="full" aria-pressed="true">Full</button>
          <button class="mode-button" type="button" data-mode-button="compact" aria-pressed="false">Compact</button>
        </div>
      </div>
      <div class="page-meta">{{ scene_count }} scene blocks</div>
    </header>
    <section class="grid">
      {{ scenes_html|safe }}
    </section>
  </main>
  <script>
{% raw %}    (() => {{
      const buttons = Array.from(document.querySelectorAll('[data-mode-button]'));
      const setMode = (mode) => {{
        document.body.classList.toggle('mode-full', mode === 'full');
        document.body.classList.toggle('mode-compact', mode === 'compact');
        buttons.forEach((button) => {{
          button.setAttribute('aria-pressed', String(button.dataset.modeButton === mode));
        }});
        localStorage.setItem('storyboardPageMode', mode);
      }};
      const savedMode = localStorage.getItem('storyboardPageMode');
      if (savedMode === 'compact') {{
        setMode('compact');
      }}
      buttons.forEach((button) => {{
        button.addEventListener('click', () => setMode(button.dataset.modeButton));
      }});
    }})();
{% endraw %}
  </script>
</body>
</html>
